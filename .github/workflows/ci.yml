name: Review checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ocr-service/requirements.lock.txt
            tests/requirements.txt
      - name: Install OCR and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-nld tesseract-ocr-eng
          python -m pip install -r ocr-service/requirements.lock.txt -r tests/requirements.txt
      - name: API, candidate, concurrency and real OCR tests
        env:
          TOPOROTOR_TEST_REAL_OCR: '1'
        run: python -m unittest discover -s tests -v
      - name: Audit locked runtime dependencies
        run: pip-audit -r ocr-service/requirements.lock.txt
  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate map, boundary and place data
        run: python3 tools/check_data.py
      - name: Load pinned Godot version and checksums
        run: |
          if grep -vE '^(#.*|GODOT_[A-Z0-9_]+=[A-Za-z0-9._-]+)?$' tools/godot-version.env; then
            echo '::error::tools/godot-version.env may only hold comments and GODOT_*=value lines.'
            exit 1
          fi
          grep -E '^GODOT_' tools/godot-version.env >> "$GITHUB_ENV"
      - name: Install pinned Godot editor
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 --output /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "$GODOT_EDITOR_SHA512  /tmp/godot.zip" | sha512sum --check --strict
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Import project and run isolated game regressions
        run: GODOT_BIN="/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" python3 tools/check_godot.py
