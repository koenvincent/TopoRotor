name: Review checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ocr-service/requirements.lock.txt
            tests/requirements.txt
      - name: Install OCR and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-nld tesseract-ocr-eng
          python -m pip install -r ocr-service/requirements.lock.txt -r tests/requirements.txt
      - name: API, candidate, concurrency and real OCR tests
        env:
          TOPOROTOR_TEST_REAL_OCR: '1'
        run: python -m unittest discover -s tests -v
      - name: Audit locked runtime dependencies
        run: pip-audit -r ocr-service/requirements.lock.txt
  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Godot editor
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          echo '02ec53d1cc7dbb9cc6355393c61b9ab43d1244751a124f10248a4802830788cd  /tmp/godot.zip' | sha256sum --check
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Import project and run isolated game regressions
        env:
          GODOT_BIN: /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
        run: python3 tools/check_godot.py
