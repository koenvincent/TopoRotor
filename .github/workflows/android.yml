name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.5.1
      GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/toporotor.keystore
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" ] || [ -z "$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" ]; then
            echo '::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. See docs/ANDROID-BUILDS.md.'
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.zip
          curl -fL --retry 3 "$base/SHA512-SUMS.txt" -o /tmp/SHA512-SUMS.txt
          cd /tmp
          cp godot.zip "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          cp templates.zip "Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          sha512sum --check --ignore-missing SHA512-SUMS.txt
          unzip -q godot.zip -d godot
          sudo install "godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          unzip -q templates.zip -d export-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv export-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Configure Android SDK and Godot
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35'
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          SETTINGS
      - name: Import and test game
        env:
          GODOT_BIN: godot
        run: python3 tools/check_godot.py
      - name: Export signed APK
        run: |
          mkdir -p build
          python3 tools/android_version.py
          godot --headless --path . --export-release Android build/TopoRotor.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/TopoRotor.apk
          cd build
          sha256sum TopoRotor.apk > TopoRotor.apk.sha256
      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: TopoRotor-Android-${{ github.run_number }}
          path: |
            build/TopoRotor.apk
            build/TopoRotor.apk.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Remove signing key
        if: always()
        run: rm -f "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH"
  release:
    # Every successful main build becomes a downloadable GitHub Release
    # (v0.4.<run>, same as the APK's version name); a pushed v* tag publishes
    # under its own name. Tags created here use GITHUB_TOKEN and therefore do
    # not trigger this workflow again.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TopoRotor-Android-${{ github.run_number }}
          path: apk
      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            tag="$REF_NAME"
          else
            tag="v0.4.$RUN_NUMBER"
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$TARGET_SHA" --title "Nieks TopoRadar $tag" --generate-notes --latest
          gh release upload "$tag" apk/TopoRotor.apk apk/TopoRotor.apk.sha256 --clobber
