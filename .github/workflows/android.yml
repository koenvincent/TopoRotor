name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  apk:
    # Only this job is cancelled by a newer push; the release job below is not.
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: true
    # Lets the owner move the signing secrets into an environment restricted to main
    # and v* tags (Settings -> Environments). Without that setting it changes nothing.
    environment: android-release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load pinned Godot version and checksums
        run: |
          if grep -vE '^(#.*|GODOT_[A-Z0-9_]+=[A-Za-z0-9._-]+)?$' tools/godot-version.env; then
            echo '::error::tools/godot-version.env may only hold comments and GODOT_*=value lines.'
            exit 1
          fi
          grep -E '^GODOT_' tools/godot-version.env >> "$GITHUB_ENV"
      - name: Check signing secrets are configured
        # Only booleans reach this step, never the secret values.
        env:
          HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAVE_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAVE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAVE_KEYSTORE" != true ] || [ "$HAVE_ALIAS" != true ] || [ "$HAVE_PASSWORD" != true ]; then
            echo '::error::Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. See docs/ANDROID-BUILDS.md.'
            exit 1
          fi
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.zip
          echo "$GODOT_EDITOR_SHA512  /tmp/godot.zip" | sha512sum --check --strict
          echo "$GODOT_TEMPLATES_SHA512  /tmp/templates.zip" | sha512sum --check --strict
          cd /tmp
          unzip -q godot.zip -d godot
          sudo install "godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          unzip -q templates.zip -d export-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv export-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
      - name: Configure Android SDK and Godot
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'build-tools;35.0.0' 'platforms;android-35'
          mkdir -p "$HOME/.config/godot"
          minor="$(echo "$GODOT_VERSION" | cut -d. -f1,2)"
          cat > "$HOME/.config/godot/editor_settings-${minor}.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          SETTINGS
      - name: Import and test game
        env:
          GODOT_BIN: godot
        run: python3 tools/check_godot.py
      - name: Stamp Android version
        id: version
        run: python3 tools/android_version.py
      - name: Export signed APK
        # The only step that sees the signing secrets. The keystore lives in a private
        # temp file that is removed when the step ends, however it ends.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          keystore="$(mktemp "$RUNNER_TEMP/toporotor-XXXXXX.keystore")"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$keystore"
          mkdir -p build
          godot --headless --path . --export-release Android build/TopoRotor.apk
      - name: Verify APK signature and write checksum
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/TopoRotor.apk
          cd build
          sha256sum TopoRotor.apk > TopoRotor.apk.sha256
      - name: Upload downloadable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: TopoRotor-Android-${{ github.run_number }}
          path: |
            build/TopoRotor.apk
            build/TopoRotor.apk.sha256
          if-no-files-found: error
          retention-days: 90
  release:
    # Every successful main build becomes the downloadable "Latest" GitHub Release
    # (tag build-<versionName>, asset name TopoRotor.apk); a pushed v* tag publishes
    # under its own name. Tags created here use GITHUB_TOKEN and therefore do not
    # trigger this workflow again.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # A started release is never cancelled midway. Per ref, so a pending tag release
    # cannot be replaced by a main release.
    concurrency:
      group: android-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: TopoRotor-Android-${{ github.run_number }}
          path: apk
      - name: Publish APK on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          TARGET_SHA: ${{ github.sha }}
          VERSION_NAME: ${{ needs.apk.outputs.version_name }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION_NAME" ]; then
            echo '::error::The apk job did not report a version name.'
            exit 1
          fi
          if [ "$REF_TYPE" = tag ]; then
            TAG="$REF_NAME"
          else
            TAG="build-$VERSION_NAME"
          fi
          # Marks releases made by this run so that only they are ever replaced.
          MARKER="toporotor-ci run=$RUN_ID sha=$TARGET_SHA"
          export TAG MARKER
          find_releases() { # prints "<id> <draft> <owned>" for every release (drafts included) on $TAG
            gh api --paginate "repos/$GH_REPO/releases" \
              --jq '.[] | select(.tag_name == env.TAG) | "\(.id) \(.draft) \((.body // "") | contains(env.MARKER))"'
          }
          existing="$(find_releases)"
          if [ -n "$existing" ]; then
            while read -r id draft owned; do
              if [ "$draft" = true ] && [ "$owned" = true ]; then
                echo "Removing unfinished draft $id left by an earlier attempt of this run."
                gh api -X DELETE "repos/$GH_REPO/releases/$id"
              else
                echo "::error::Release $id for tag $TAG already exists and was not created as a draft by this run. Not touching it; use another tag or remove it first."
                exit 1
              fi
            done <<< "$existing"
          elif [ "$REF_TYPE" != tag ] && gh api "repos/$GH_REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Git tag $TAG already exists without a release from this run. Not reusing it."
            exit 1
          fi
          # Create as a draft with both assets attached, then publish in one step.
          gh release create "$TAG" apk/TopoRotor.apk apk/TopoRotor.apk.sha256 \
            --draft --target "$TARGET_SHA" --title "Nieks TopoRadar $TAG" \
            --notes "<!-- $MARKER -->" --generate-notes
          created="$(find_releases)"
          if [ "$(printf '%s\n' "$created" | grep -c .)" != 1 ]; then
            echo "::error::Expected exactly one release for $TAG after creating it, found: $created"
            exit 1
          fi
          read -r id draft owned <<< "$created"
          if [ "$draft" != true ] || [ "$owned" != true ]; then
            echo "::error::Release $id for $TAG is not the draft this run created."
            exit 1
          fi
          assets="$(gh api "repos/$GH_REPO/releases/$id" --jq '[.assets[] | select(.state == "uploaded") | .name] | sort | join(",")')"
          if [ "$assets" != "TopoRotor.apk,TopoRotor.apk.sha256" ]; then
            echo "::error::Draft $id has unexpected assets: $assets"
            exit 1
          fi
          gh api -X PATCH "repos/$GH_REPO/releases/$id" -F draft=false -f make_latest=true >/dev/null
          latest="$(gh api "repos/$GH_REPO/releases/latest" --jq .id)"
          if [ "$latest" != "$id" ]; then
            echo "::error::Release $id ($TAG) was published but is not the Latest release (Latest is $latest)."
            exit 1
          fi
          echo "Published $TAG as Latest."
